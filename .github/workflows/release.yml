name: release

# Creates a GitHub release (read by the Statamic Marketplace) when a v* tag is
# pushed. Ordinary commits never create one.
#
# Release notes come from the tag's section of CHANGELOG.md, matched on its
# Keep a Changelog heading: `## [2.3.0] - 2026-09-17` for tag v2.3.0. With no
# matching section, GitHub's auto-generated notes are used instead.

on:
  push:
    tags: ['v*']

# Write is needed to create the release (through gh, not git, so the
# checkout keeps no credentials).
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v heading="## [$version]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > notes.md
          fi
          touch notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-pushing a tag shouldn't fail the run or overwrite edited notes.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping."
            exit 0
          fi

          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            echo "No CHANGELOG.md section for $GITHUB_REF_NAME, using generated notes."
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi

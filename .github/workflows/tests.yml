name: tests

on:
  push:
  pull_request:

# Read-only: setup-php also copies the token into Composer's auth.json, so
# a compromised dependency's scripts would otherwise get a writable token.
permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}${{ matrix.lowest && ' (lowest deps)' || '' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # composer.lock isn't committed, so each PHP version resolves the
        # newest Statamic it supports. 8.3 is the floor: Statamic 6 pulls
        # Laravel 12.40+/13, which requires PHP ^8.3.
        php: ['8.3', '8.4', '8.5']
        lowest: [false]
        # Canary relies on Statamic\Forms\SendEmails, which is internal, so
        # also test the oldest Statamic 6 release the constraint allows.
        include:
          - php: '8.3'
            lowest: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist ${{ matrix.lowest && '--prefer-lowest' || '' }}

      - name: Run tests
        run: vendor/bin/phpunit
